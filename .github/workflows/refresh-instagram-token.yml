name: Refresh Instagram token

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request safe token renewal
        env:
          REFRESH_SECRET: ${{ secrets.INSTAGRAM_TOKEN_CRON_SECRET }}
        run: |
          test -n "$REFRESH_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $REFRESH_SECRET" \
            https://cms.usemewithstyle.shop/api/cron/refresh-instagram-token
