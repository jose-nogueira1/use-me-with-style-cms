name: PostgreSQL encrypted backup

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch encrypted dump from the private Railway database
        env:
          CMS_ORIGIN: ${{ vars.OPS_CMS_URL }}
        run: |
          set -euo pipefail
          umask 077
          test "$CMS_ORIGIN" = "https://use-me-with-style-cms-production-cb93153d.up.railway.app"
          bearer=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=useme-production-postgres-backup" | jq -er '.value')
          echo "::add-mask::$bearer"
          archive="$RUNNER_TEMP/useme-postgres-${GITHUB_RUN_ID}.dump.enc"
          curl --fail --silent --show-error --max-time 240 \
            -X POST -H "Authorization: Bearer $bearer" \
            "$CMS_ORIGIN/api/operations/database-backup" -o "$archive"
          test -s "$archive"
          echo "artifact_path=$archive" >> "$GITHUB_ENV"

      - name: Restore the encrypted archive into disposable PostgreSQL 18
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          db=$(docker run -d --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18)
          trap 'docker rm -fv "$db" >/dev/null' EXIT
          for i in {1..60}; do
            docker exec "$db" pg_isready -h 127.0.0.1 -U postgres >/dev/null && break
            sleep 1
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "$artifact_path" |
            docker exec -i "$db" pg_restore --single-transaction --exit-on-error \
              --no-owner --no-privileges -U postgres -d postgres 2>/dev/null
          docker exec "$db" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -c \
            "select count(*) from public.products; select count(*) from public.orders;" >/dev/null
          echo "Restored and queried the isolated PostgreSQL 18 database." >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 $(sha256sum "$artifact_path" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain encrypted backup for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: useme-postgres-${{ github.run_id }}
          path: ${{ env.artifact_path }}
          if-no-files-found: error
          retention-days: 14
