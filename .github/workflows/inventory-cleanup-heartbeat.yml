name: Inventory cleanup heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: production-inventory-cleanup-heartbeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Release expired inventory reservations
        run: node scripts/operations-monitor.mjs --mode=inventory
        env:
          OPS_CMS_URL: https://cms.usemewithstyle.shop
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: Use Me With Style Operations
          OPS_ALERT_EMAIL: ${{ vars.OPS_ALERT_EMAIL }}
